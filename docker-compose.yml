version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: codebase-docs-postgres
    environment:
      POSTGRES_USER: codebase_docs
      POSTGRES_PASSWORD: codebase_docs_password
      POSTGRES_DB: codebase_docs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codebase_docs"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: codebase-docs-backend
    environment:
      DATABASE_URL: postgresql://codebase_docs:codebase_docs_password@postgres:5432/codebase_docs
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PORT: 3001
      NODE_ENV: production
      WORKSPACE_DIR: /app/workspace
    ports:
      - "3001:3001"
    volumes:
      - workspace_data:/app/workspace
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codebase-docs-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  workspace_data:
